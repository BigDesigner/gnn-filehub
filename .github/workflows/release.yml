name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Must match the committed VERSION; blank uses VERSION.'
        required: false
        default: ''
      create_github_release:
        description: 'Create GitHub release and tag'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  build-and-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          REQUESTED_VERSION="$VERSION_OVERRIDE"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then REQUESTED_VERSION="$GITHUB_REF_NAME"; fi
          VERSION=$(python3 .tests/check-release.py --requested "$REQUESTED_VERSION")
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Package and inspect
        run: |
          zip -r "gnn-filehub-v${VERSION}.zip" gnn-filehub
          python3 .tests/check-release.py --archive "gnn-filehub-v${VERSION}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: gnn-filehub-v${{ env.VERSION }}
          path: gnn-filehub-v${{ env.VERSION }}.zip
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_github_release == true
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          generate_release_notes: true
          files: gnn-filehub-v${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
