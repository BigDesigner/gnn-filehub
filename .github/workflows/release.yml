name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Opsiyonel sürüm ezme (Örn: 1.0.1). Boş bırakılırsa VERSION dosyasından okunur.'
        required: false
        default: ''
      create_github_release:
        description: 'GitHub Release & Tag oluşturulsun mu?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-release:
    name: Build & Package Plugin Zip
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Resolve Version Number
        id: version
        run: |
          # Tag push ise tag adından oku (v1.0.0 → 1.0.0)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ github.event.inputs.version_override }}" ]; then
            VERSION="${{ github.event.inputs.version_override }}"
          else
            VERSION=$(cat gnn-filehub/VERSION | tr -d '\r\n ')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version resolved: $VERSION"

      - name: Prepare Clean Plugin Package Directory
        run: |
          mkdir -p dist/gnn-filehub
          cp -r gnn-filehub/* dist/gnn-filehub/

      - name: Create Zip Archive
        run: |
          cd dist
          zip -r "../gnn-filehub-v${VERSION}.zip" gnn-filehub
          cd ..
          ls -lh gnn-filehub-v${VERSION}.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnn-filehub-v${{ env.VERSION }}
          path: gnn-filehub-v${{ env.VERSION }}.zip
          retention-days: 90

      - name: Create GitHub Release & Attach Zip
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            ## GNN FileHub NextGen v${{ env.VERSION }}
            - %100 WordPress Core Native dosya yükleme ve bulut depolama eklentisi.
            - Üretim ortamı için derlenmiş temiz eklenti zip paketi ektedir.
          files: gnn-filehub-v${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
